name: Publish

# Publishes to npm when a GitHub Release is published. The release tag (vX.Y.Z)
# is the source of truth for the version; package.json on main is synced back
# to it afterwards.
on:
    release:
        types: [published]

permissions:
    contents: write
    id-token: write # npm provenance

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  registry-url: https://registry.npmjs.org
            - run: npm ci
            - run: npm test
            - name: Set version from release tag
              run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
            - name: Check whether this version is already on npm
              id: check
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  if npm view "@anorak-games/eslint-config@$VERSION" version > /dev/null 2>&1; then
                      echo "published=true" >> "$GITHUB_OUTPUT"
                      echo "@anorak-games/eslint-config@$VERSION already published — skipping publish"
                  fi
            - name: Publish to npm
              if: steps.check.outputs.published != 'true'
              run: npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
            - name: Sync version back to main
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git fetch origin main
                  git checkout -B main origin/main
                  CURRENT=$(node -p "require('./package.json').version")
                  if [ "$CURRENT" != "$VERSION" ]; then
                      npm version "$VERSION" --no-git-tag-version --allow-same-version
                      git commit -am "chore: sync version to v$VERSION"
                      git push origin main
                  fi
